name: Check for Elementor Updates

on:
  schedule:
    - cron: '0 0 1,15 * *' # biweekly
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  check-version:
    uses: artkrsk/stub-package-workflows/.github/workflows/stub-check-updates.yml@17a54677f1a78e137125ce050ff292a695782d0d # master
    with:
      primary_slug: elementor
      secondary_source: github-release
      secondary_repo: proelements/proelements
