name: Generate Stubs

on:
  workflow_dispatch:
    inputs:
      source_version:
        description: 'Elementor version: "latest", "X.Y.Z", or "dev" (GitHub main)'
        required: true
        default: 'latest'
        type: string
      secondary_version:
        description: 'Elementor Pro version: "latest", "X.Y.Z", or "" to skip'
        required: false
        default: 'latest'
        type: string

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  generate:
    uses: artkrsk/stub-package-workflows/.github/workflows/stub-generate.yml@17a54677f1a78e137125ce050ff292a695782d0d # master
    with:
      source_version: ${{ inputs.source_version }}
      secondary_version: ${{ inputs.secondary_version }}
      wp_org_slug: elementor
      primary_dev_repo: elementor/elementor
      secondary_github_repo: proelements/proelements
      source_env_name: ELEMENTOR_PATH
      secondary_env_name: ELEMENTOR_PRO_PATH
      stub_file: elementor-stubs.php
      version_define_name: ELEMENTOR_VERSION
      release_title: 'Elementor'
